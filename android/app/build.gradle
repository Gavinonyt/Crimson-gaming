plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultragaming.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ultragaming.launcher'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
