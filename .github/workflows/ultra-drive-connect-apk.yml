name: Build Ultra Drive Connect APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ultra-drive-connect/**"
      - ".github/workflows/ultra-drive-connect-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK with Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: ":app:assembleDebug --stacktrace --warning-mode all"
          build-root-directory: "ultra-drive-connect"

      - name: Verify APK exists
        shell: bash
        run: |
          APK="ultra-drive-connect/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Gradle completed without producing the expected APK: $APK"
            find ultra-drive-connect/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Drive-Connect-debug-apk
          path: ultra-drive-connect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
