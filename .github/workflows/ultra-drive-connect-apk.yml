name: Build Ultra Drive Connect APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ultra-drive-connect/**"
      - ".github/workflows/ultra-drive-connect-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK
        working-directory: ultra-drive-connect
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s ultra-drive-connect/app/build/outputs/apk/debug/app-debug.apk
          ls -lh ultra-drive-connect/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Drive-Connect-debug-apk
          path: ultra-drive-connect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
