name: Check Ultra inline JavaScript
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/check-inline-js.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script\\b([^>]*)>([\\s\\S]*?)</script>', html, re.I)
          inline = [body for attrs, body in scripts if not re.search(r'\\bsrc\\s*=', attrs, re.I) and body.strip()]
          if len(inline) != 1:
              raise SystemExit(f'Expected one inline script, found {len(inline)}')
          open('/tmp/ultra-inline.js', 'w', encoding='utf-8').write(inline[0])
          PY
          node --check /tmp/ultra-inline.js